<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptocurrency Profit Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto p-6">
        <h1 class="text-3xl font-bold mb-4 text-center">Cryptocurrency Profit Calculator</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                <form id="cryptoForm" class="space-y-4">
                    <div class="form-group">
                        <label for="crypto" class="block text-sm font-medium">Select Cryptocurrency:</label>
                        <select id="crypto" class="w-full p-2 bg-gray-700 border border-gray-600 rounded" required>
                            <!-- Options will be populated by JS -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="currency" class="block text-sm font-medium">Select Currency:</label>
                        <select id="currency" class="w-full p-2 bg-gray-700 border border-gray-600 rounded" required>
                            <!-- Options will be populated by JS -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="investment" class="block text-sm font-medium">Investment Amount:</label>
                        <input type="number" id="investment" class="w-full p-2 bg-gray-700 border border-gray-600 rounded" placeholder="Enter investment amount" required>
                    </div>
                    <div class="form-group">
                        <label for="purchasePrice" class="block text-sm font-medium">Purchase Price per Unit:</label>
                        <input type="number" id="purchasePrice" class="w-full p-2 bg-gray-700 border border-gray-600 rounded" placeholder="Enter purchase price per unit" required>
                    </div>
                    <button type="button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded" onclick="calculateProfit()">Calculate Profit</button>
                </form>
            </div>
            
            <div id="resultDiv" class="bg-gray-800 p-6 rounded-lg shadow-lg hidden">
                <h2 class="text-xl font-bold mb-4">Result</h2>
                <div id="cryptoDetails" class="mb-4">
                    <!-- Cryptocurrency details will be populated here -->
                </div>
                <div id="profitResult" class="mb-4"></div>
                <canvas id="profitChart"></canvas>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
    <script src="./cryptoProfitCalculator.js"></script>
</body>
</html>
