<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced PDF and Image Compressor</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto py-10">
        <h1 class="text-3xl font-bold text-center mb-8">Advanced PDF and Image Compressor</h1>

        <div class="bg-gray-800 p-8 rounded-lg shadow-lg">
            <h2 class="text-2xl font-bold mb-4">Compress Your Files</h2>

            <div class="mb-6">
                <label for="fileInput" class="block mb-2 font-bold">Select PDF or Image</label>
                <input type="file" id="fileInput" class="w-full p-2 bg-gray-700 border border-gray-600 rounded" accept=".pdf, .jpg, .jpeg, .png">
            </div>

            <div class="mb-6">
                <label for="customSize" class="block mb-2 font-bold">Custom File Size (KB)</label>
                <input type="number" id="customSize" class="w-full p-2 bg-gray-700 border border-gray-600 rounded" placeholder="Enter desired file size">
            </div>

            <button type="button" class="bg-blue-500 hover:bg-blue-600 text-white p-2 rounded mb-4" onclick="compressFile()">Compress</button>

            <div id="result" class="mt-8"></div>

            <div id="preview" class="mt-8 grid grid-cols-2 gap-4 hidden">
                <div>
                    <h3 class="text-xl font-bold mb-2">Before Compression</h3>
                    <img id="beforeImage" src="" alt="Before Compression" class="w-full">
                </div>
                <div>
                    <h3 class="text-xl font-bold mb-2">After Compression</h3>
                    <img id="afterImage" src="" alt="After Compression" class="w-full">
                </div>
            </div>
        </div>
    </div>

    <script src="compressor.js"></script>
</body>
</html>
