<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Image Compressor</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #444;
            outline: none;
            opacity: 0.7;
            transition: opacity .2s;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #4a90e2;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #4a90e2;
            cursor: pointer;
        }

        .progress-bar {
            height: 8px;
            background-color: #4a90e2;
            border-radius: 5px;
            transition: width 0.3s;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto py-10">
        <h1 class="text-3xl font-bold text-center mb-8">Advanced Image Compressor</h1>

        <div class="bg-gray-800 p-8 rounded-lg shadow-lg">
            <h2 class="text-2xl font-bold mb-4">Compress Your Files</h2>

            <div class="mb-6">
                <label for="fileInput" class="block mb-2 font-bold">Select Image</label>
                <input type="file" id="fileInput" class="w-full p-2 bg-gray-700 border border-gray-600 rounded" accept=".jpg, .jpeg, .png">
            </div>

            <div class="mb-6">
                <label for="compressionLevel" class="block mb-2 font-bold">Compression Level</label>
                <input type="range" id="compressionLevel" min="1" max="100" value="50" class="slider" oninput="updateCompressionValue()">
                <p id="compressionValue" class="text-right">50%</p>
            </div> 

            <button type="button" class="w-full text-center font-semibold bg-blue-500 hover:bg-blue-600 text-white p-2 rounded" onclick="compressFile()">Compress</button>

            <div class="mt-4">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div id="beforeAfter" class="mt-8 grid grid-cols-2 gap-4">
                <div>
                    <h3 class="font-bold">Before Compression</h3>
                    <img id="originalImage" src="" alt="Original" class="w-full" style="display: none;">
                    <p id="originalSize" class="text-gray-400"></p>
                </div>
                <div>
                    <h3 class="font-bold">After Compression</h3>
                    <img id="compressedImage" src="" alt="Compressed" class="w-full" style="display: none;">
                    <p id="compressedSize" class="text-gray-400"></p>
                </div>
            </div>

            <div id="result" class="mt-8"></div>
        </div>
    </div>
    <footer id="footer"></footer>
    <!-- Load Compress.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression/dist/browser-image-compression.min.js"></script>

    <script src="compressor.js"></script>
    <script src="./../scripts/footer.js"></script>
</body>
</html>
