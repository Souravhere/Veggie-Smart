        // Function to dynamically load tools based on categories
        function loadTools() {
            const toolsContainer = document.getElementById('toolsContainer');
            toolsContainer.innerHTML = ''; // Clear existing content

            for (const category in toolsData) {
                const categoryContainer = document.createElement('div');
                categoryContainer.className = 'mb-8';

                const categoryTitle = document.createElement('h2');
                categoryTitle.className = 'text-2xl font-bold mb-4';
                categoryTitle.textContent = category.replace(/([A-Z])/g, ' $1').trim(); // Adding spaces between words

                categoryContainer.appendChild(categoryTitle);

                const toolsGrid = document.createElement('div');
                toolsGrid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6';

                toolsData[category].forEach(tool => {
                    const toolCard = document.createElement('div');
                    toolCard.className = 'tool-card bg-gray-800 p-4 rounded-lg';

                    toolCard.innerHTML = `
                        <img src="${tool.imageSrc}" alt="${tool.imageAlt}" class="w-16 h-16 mb-4">
                        <h3 class="text-xl font-semibold">${tool.buttonName}</h3>
                        <p class="tool-description text-sm mt-2">${tool.description}</p>
                    `;

                    toolsGrid.appendChild(toolCard);
                });

                categoryContainer.appendChild(toolsGrid);
                toolsContainer.appendChild(categoryContainer);
            }
        }

        // Search function to filter tools
        function filterTools() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const toolCards = document.querySelectorAll('.tool-card');

            toolCards.forEach(card => {
                const toolName = card.querySelector('h3').textContent.toLowerCase();
                const toolDescription = card.querySelector('p').textContent.toLowerCase();
                if (toolName.includes(query) || toolDescription.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Load tools on page load
        loadTools();
