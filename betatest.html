<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Display</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .toolscontainer img {
            transition: transform 0.3s ease-in-out;
        }
        .toolscontainer img:hover {
            transform: scale(1.1);
        }
        .tool-info {
            display: none;
            position: absolute;
            background-color: #333;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            z-index: 10;
        }
        .tool:hover .tool-info {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto p-4">
        <div class="mb-4">
            <input id="search-bar" type="text" placeholder="Search tools..." class="w-full p-2 bg-gray-800 border border-gray-700 rounded-lg">
        </div>
        <div id="tools-container" class="toolscontainer grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Tools will be injected here -->
        </div>
    </div>

    <script src="./scripts/Test.js"></script>
</body>
</html>
