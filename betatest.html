<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Display</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .tool-card {
    background-color: #1f2937;
    border-radius: 8px;
    overflow: hidden;
    transition: box-shadow 0.3s ease, height 0.3s ease;
    /* Added height transition */
    position: relative;
}

.tool-card img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    margin-top: 16px;
}

.tool-card-content {
    padding: 12px;
    text-align: center;
}

.tool-card-title {
    color: #e5e7eb;
    font-size: 1.125rem; /* 18px */
    font-weight: 600;
    margin-top: 8px;
}

.tool-card-tag {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 12px;
    background-color: #4b5563;
    color: #e5e7eb;
    font-size: 0.875rem; /* 14px */
    margin-top: 4px;
}

.tool-card-button {
    display: block;
    margin-top: 12px;
    background-color: #10b981;
    color: #fff;
    padding: 8px;
    border-radius: 8px;
    text-decoration: none;
    text-align: center;
    font-weight: 600;
    transition: background-color 0.3s ease;
}

.tool-card-button:hover {
    background-color: #059669;
}

.more-info {
    max-height: 0;
    overflow: hidden;
    padding: 0 12px;
    background-color: rgba(0, 0, 0, 0.75);
    color: #fff;
    border-top: 1px solid #4b5563;
    transition: max-height 0.3s ease, padding 0.3s ease;
}

.more-info.show {
    max-height: 200px; /* Adjust as needed */
    padding: 12px;
}

.show-more-btn {
    display: block;
    margin-top: 12px;
    background-color: #4b5563;
    color: #e5e7eb;
    padding: 8px;
    border-radius: 8px;
    text-decoration: none;
    text-align: center;
    font-weight: 600;
    transition: background-color 0.3s ease;
}

.show-more-btn:hover {
    background-color: #374151;
}

    </style>
</head>
<body class="bg-gray-900 text-white">

    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-8 text-center">Explore Our Tools</h1>
        <input type="text" id="search" placeholder="Search tools..." class="w-full p-3 mb-6 rounded-lg bg-gray-800 text-white shadow-md focus:outline-none focus:ring-2 focus:ring-green-600">

        <div id="toolsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Tools will be injected here dynamically -->
        </div>
    </div>

    <script src="scripts/Test.js"></script>
</body>
</html>
