<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Display</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Tool Container Hover Effects */
        .toolscontainer .tool {
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            background: linear-gradient(145deg, #1f2937, #111827);
            box-shadow: 6px 6px 12px #0c0f16, -6px -6px 12px #283349;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .toolscontainer .tool:hover {
            transform: translateY(-5px);
            box-shadow: 8px 8px 16px #0c0f16, -8px -8px 16px #283349;
        }
        .toolscontainer img {
            transition: transform 0.3s ease-in-out;
            border-radius: 10px;
        }
        .toolscontainer img:hover {
            transform: scale(1.1);
        }

        /* Tool Information on Hover */
        .tool-info {
            display: none;
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px;
            border-radius: 5px;
            z-index: 10;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .tool:hover .tool-info {
            display: block;
            opacity: 1;
        }

        /* Search Bar Styling */
        #search-bar {
            border: none;
            outline: none;
            background-color: #1f2937;
            color: #ffffff;
            padding: 10px 15px;
            border-radius: 5px;
            transition: box-shadow 0.3s ease-in-out;
            box-shadow: inset 4px 4px 8px #141a23, inset -4px -4px 8px #2a384b;
        }
        #search-bar:focus {
            box-shadow: inset 4px 4px 8px #0c0f16, inset -4px -4px 8px #283349;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="container mx-auto p-6">
        <!-- Search Bar -->
        <div class="mb-8 relative">
            <input id="search-bar" type="text" placeholder="Search tools..." class="w-full p-4 text-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 4a7 7 0 100 14 7 7 0 000-14z" />
            </svg>
        </div>

        <!-- Tools Container -->
        <div id="tools-container" class="toolscontainer grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <!-- Tools will be injected here -->
        </div>
    </div>

    <script src="./scripts/Test.js"></script>
</body>
</html>
