<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Display</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .hover-info {
            display: none;
            position: absolute;
            background-color: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
            max-width: 300px;
        }
        .tool-card:hover .hover-info {
            display: block;
        }
        .tool-card {
            position: relative;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-6 text-center">Our Tools</h1>
        <input type="text" id="search" placeholder="Search tools..." class="w-full p-2 mb-4 rounded bg-gray-700 text-white">

        <div id="toolsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Tools will be injected here dynamically -->
        </div>
    </div>

    <script src="path/to/your/script.js"></script>
</body>
</html>
